<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso restringido</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .caja {
            text-align: center;
            background: #222;
            padding: 40px;
            border-radius: 15px;
        }

        input {
            padding: 12px;
            font-size: 16px;
            margin: 10px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #foto {
            display: none;
            max-width: 90vw;
            max-height: 80vh;
        }
    </style>
</head>

<body>

    <div class="caja" id="login">
        <h1>🔒 ACCESO RESTRINGIDO</h1>
        <p>Introduce la contraseña</p>

        <input type="password" id="password" placeholder="Contraseña">
        <br>
        <button onclick="comprobar()">ENTRAR</button>
    </div>

    <img id="foto" src="foto.jpg">

    <script>
        function comprobar() {
            const contraseña = document.getElementById("password").value;

            if (contraseña === "BIGBRO") {
                document.getElementById("login").style.display = "none";
                document.getElementById("foto").style.display = "block";
            } else {
                alert("❌ CONTRASEÑA INCORRECTA");
                window.location.href = "about:blank";
            }
        }
    </script>

</body>
</html>
